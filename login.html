<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Pastelería Mil Sabores</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Lato:wght@400;700;900&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav>
    <div class="nav-wrapper container">
      <a href="index.html" class="brand-logo"><i class="material-icons">cake</i>Mil Sabores</a>
      <a href="#" data-target="menu-movil" class="sidenav-trigger"><i class="material-icons">menu</i></a>
      <ul class="right hide-on-med-and-down">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="carrito.html"><i class="material-icons left" style="margin-right:4px">shopping_cart</i>Carrito <span id="carrito-badge">0</span></a></li>
      </ul>
      <ul class="right" id="nav-usuario"></ul>
    </div>
  </nav>
  <ul class="sidenav" id="menu-movil">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="catalogo.html">Catálogo</a></li>
    <li><a href="registro.html">Regístrate</a></li>
  </ul>

  <section>
    <div class="container">
      <div class="center-align" style="margin-bottom:30px">
        <h1 style="font-size:2.4rem">Inicia sesión</h1>
        <p class="texto-secundario">Accede a tu cuenta para ver tus beneficios y pedidos.</p>
      </div>

      <form id="form-login" class="form-card" novalidate>
        <div class="input-field">
          <input id="email" type="email" autocomplete="email" />
          <label for="email">Correo electrónico</label>
          <div class="mensaje-error"></div>
        </div>
        <div class="input-field">
          <input id="password" type="password" autocomplete="current-password" />
          <label for="password">Contraseña</label>
          <div class="mensaje-error"></div>
        </div>
        <button type="submit" class="btn btn-large waves-effect waves-light" style="width:100%">Entrar</button>
        <p class="center-align" style="margin-top:20px">
          ¿Aún no tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </p>
      </form>
    </div>
  </section>

  <footer class="page-footer">
    <div class="footer-copyright">
      <div class="container">© <span class="anio-actual"></span> Pastelería Mil Sabores</div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
